<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Warehouse — ROS 2 + Gazebo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="status">connecting…</div>
<div id="robot-table">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>X</th>
            <th>Y</th>
            <th>Status</th>
            <th>Mission</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="robot-table-body"></tbody>
    </table>
</div>
<div id="coords" style="display:none;">
    <div><span class="label">ROBOT:</span> <span class="val" id="coord-id">—</span></div>
    <div><span class="label">X:</span> <span class="val" id="coord-x">—</span></div>
    <div><span class="label">Y:</span> <span class="val" id="coord-y">—</span></div>
    <div><span class="label">YAW:</span> <span class="val" id="coord-yaw">—</span></div>
</div>
<div id="help">WASD — управление | Esc — выход</div>

<script src="script.js"></script>
</body>
</html>
