<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Warehouse — ROS 2 + Gazebo</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; overflow: hidden; }
  canvas { display: block; }
  #status {
    position: fixed; top: 10px; left: 10px;
    color: #4af; font-family: monospace; font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">connecting…</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

// Подгоняем canvas под окно
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ── Параметры мира ────────────────────────────────────
const SCALE = 120;          // пикселей на метр
let camera = { x: 5, y: 4 }; // центр экрана (в метрах) — следит за роботом

// Стены (координаты в метрах, совпадают с SDF)
const walls = [
  { x1: -1, y1: -1, x2: 11, y2: -1 },  // низ
  { x1: -1, y1: 9,  x2: 11, y2: 9  },  // верх
  { x1: -1, y1: -1, x2: -1, y2: 9  },  // лево
  { x1: 11, y1: 9,  x2: 11, y2: 7  },  // право верх
  { x1: 11, y1: 1,  x2: 11, y2: -1 },  // право низ
];

// ── Преобразование мир → экран ────────────────────────
function toPx(x, y) {
  return [
    canvas.width  / 2 + (x - camera.x) * SCALE,
    canvas.height / 2 - (y - camera.y) * SCALE
  ];
}

// ── Отрисовка сетки ───────────────────────────────────
function drawGrid() {
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  const range = 30; // рисуем сетку ±30 метров вокруг камеры
  const cx = Math.round(camera.x);
  const cy = Math.round(camera.y);
  for (let i = cx - range; i <= cx + range; i++) {
    const [x1, y1] = toPx(i, cy - range);
    const [x2, y2] = toPx(i, cy + range);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  for (let j = cy - range; j <= cy + range; j++) {
    const [x3, y3] = toPx(cx - range, j);
    const [x4, y4] = toPx(cx + range, j);
    ctx.beginPath(); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
  }
}

// ── Отрисовка стен ────────────────────────────────────
function drawWalls() {
  ctx.strokeStyle = '#888';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  walls.forEach(w => {
    const [x1, y1] = toPx(w.x1, w.y1);
    const [x2, y2] = toPx(w.x2, w.y2);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });
}

// ── Отрисовка робота ──────────────────────────────────
function drawRobot(r) {
  const [px, py] = toPx(r.x, r.y);

  // корпус (прямоугольник 0.3×0.2 м, повёрнутый на yaw)
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-r.yaw);  // экранный y инвертирован
  ctx.fillStyle = r.status === 'error' ? '#f44' : (r.status === 'moving' ? '#4f4' : '#4af');
  ctx.fillRect(-0.15 * SCALE, -0.1 * SCALE, 0.3 * SCALE, 0.2 * SCALE);
  ctx.restore();

  // стрелка направления
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + Math.cos(r.yaw) * 0.25 * SCALE, py - Math.sin(r.yaw) * 0.25 * SCALE);
  ctx.stroke();

  // id робота
  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.fillText(r.id, px + 15, py - 15);
}

// ── WebSocket ─────────────────────────────────────────
let robots = [];
let ws;

function connect() {
  const orchestratorPort = window.location.port ? (parseInt(window.location.port, 10) + 1) : 8191;
ws = new WebSocket(`ws://${window.location.hostname}:${orchestratorPort}/ws`);

  ws.onopen = () => {
    statusEl.textContent = 'connected';
    statusEl.style.color = '#4f4';
  };

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      robots = data.robots || [];
    } catch (err) {
      console.error('bad json', err);
    }
  };

  ws.onerror = () => {
    statusEl.textContent = 'ws error';
    statusEl.style.color = '#f44';
  };

  ws.onclose = () => {
    statusEl.textContent = 'disconnected — reconnecting…';
    statusEl.style.color = '#f44';
    setTimeout(connect, 1000);
  };
}
connect();

// ── Главный цикл ──────────────────────────────────────
function loop() {
  // камера следит за первым роботом
  if (robots.length > 0) {
    camera.x += (robots[0].x - camera.x) * 0.1;  // плавное следование
    camera.y += (robots[0].y - camera.y) * 0.1;
  }

  // очистка
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawGrid();
  drawWalls();
  robots.forEach(drawRobot);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
