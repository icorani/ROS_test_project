name: stress
bounds:
  x_min: -2
  y_min: -2
  x_max: 14
  y_max: 12
  wall_thickness: 0.3

nodes:
  # Left side main corridor
  L1: {x: 0, y: 6}
  L2: {x: 2, y: 6}
  L3: {x: 4, y: 6}
  L4: {x: 6, y: 6}
  L5: {x: 8, y: 6}
  L6: {x: 10, y: 6}
  
  # Middle row
  M1: {x: 0, y: 4}
  M2: {x: 2, y: 4}
  M3: {x: 4, y: 4}
  M4: {x: 6, y: 4}
  M5: {x: 8, y: 4}
  M6: {x: 10, y: 4}
  
  # Right vertical corridor nodes
  R1: {x: 10, y: 8}
  R2: {x: 10, y: 2}
  R3: {x: 10, y: 0}  # bottom of right corridor
  
  # Top of right side
  T1: {x: 8, y: 8}  # connected to R1 area
  
parking:
  P1: {x: 12, y: 8}
  P2: {x: 12, y: 6}
  P3: {x: 12, y: 4}
  P4: {x: 12, y: 2}
  P5: {x: 12, y: 0}

edges:
  # Left horizontal line on top part
  - [L1, L2]
  - [L2, L3]
  - [L3, L4]
  - [L4, L5]
  - [L5, L6]
  
  # Middle horizontal
  - [M1, M2]
  - [M2, M3]
  - [M3, M4]
  - [M4, M5]
  - [M5, M6]
  
  # Vertical connections between rows
  - [L1, M1]
  - [L2, M2]
  - [L4, M4]  # line 5 shows verticals at L3 position? Let us look again
  # From ASCII line 5: "| |       |       |   |      " - verticals at positions corresponding to nodes
  - [L3, M3]
  - [L5, M5]
  - [L6, M6]
  
  # Right side vertical corridor going down from top
  - [T1, R1]  # top right horizontal connection
  - [R1, L6]  # connects to main grid? Or separate branch
  - [R1, P1]
  - [L6, P2]
  - [M6, P3]
  - [M6, R2]
  - [R2, P4]
  - [R2, R3]
  - [R3, P5]

robots:
  robot_1:
    start_node: P1
    start_x: 12
    start_y: 8
    start_yaw: 0
    color: "#4af"
  robot_2:
    start_node: P5
    start_x: 12
    start_y: 0
    start_yaw: 3.14159
    color: "#f4a"
