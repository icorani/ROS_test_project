name: stress
bounds:
  x_min: -2
  y_min: -2
  x_max: 14
  y_max: 12
  wall_thickness: 0.3

nodes:
  # Ряд A (верх)
  A1: {x: 0,  y: 8}
  A2: {x: 2,  y: 8}
  A3: {x: 4,  y: 8}
  A4: {x: 6,  y: 8}
  A5: {x: 8,  y: 8}
  R2: {x: 10, y: 8}

  # Ряд B
  B1: {x: 0,  y: 6}
  B2: {x: 2,  y: 6}
  B3: {x: 4,  y: 6}
  B4: {x: 6,  y: 6}
  B5: {x: 8,  y: 6}
  B6: {x: 10, y: 6}

  # Правая цепочка
  R1: {x: 10, y: 10}
  R3: {x: 10, y: 4}
  R4: {x: 10, y: 2}

parking:
  P1: {x: 12, y: 10}
  P2: {x: 12, y: 8}
  P3: {x: 12, y: 6}
  P4: {x: 12, y: 4}
  P5: {x: 12, y: 2}

edges:
  # Горизонталь ряд A
  - [A1, A2]
  - [A2, A3]
  - [A3, A4]
  - [A4, A5]
  # Горизонталь ряд B
  - [B1, B2]
  - [B2, B3]
  - [B3, B4]
  - [B4, B5]
  - [B5, B6]
  # Парковки
  - [R1, P1]
  - [R2, P2]
  - [B6, P3]
  - [R3, P4]
  - [R4, P5]
  # Вертикаль A–B только по col 1, 3, 5
  - [A1, B1]
  - [A3, B3]
  - [A5, B5]
  # Правая цепочка
  - [R1, R2]
  - [R2, B6]
  - [B6, R3]
  - [R3, R4]

robots:
  robot_1:
    start_node: C1
    start_x: 0
    start_y: 4
    start_yaw: 0
    color: "#4af"
  robot_2:
    start_node: C5
    start_x: 8
    start_y: 4
    start_yaw: 0
    color: "#f4a"