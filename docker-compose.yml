services:
  ros:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.ros
    container_name: ros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ./ros_ws:/ros_ws
    command: bash -c "source /opt/ros/jazzy/setup.bash && tail -f /dev/null"
    network_mode: host
    ipc: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gazebo:
    image: osrf/ros:jazzy-desktop-full
    container_name: gazebo
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DISPLAY=${DISPLAY:-:0}
      - QT_QPA_PLATFORM=xcb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./gazebo:/gazebo
    command: >
      bash -c "
      source /opt/ros/jazzy/setup.bash &&
      gz sim -s -r /gazebo/warehouse_${MAP}.sdf &
      sleep 5 &&
      ros2 run ros_gz_sim create
      --world empty
      --file \$(ros2 pkg prefix --share turtlebot3_gazebo)/models/turtlebot3_burger/model.sdf
      --name turtle3
      -x ${ROBOT_START_X:-0} -y ${ROBOT_START_Y:-0} -z ${ROBOT_START_Z:-0.1} &
      sleep 3 &&
      ros2 run ros_gz_bridge parameter_bridge
      /cmd_vel@geometry_msgs/msg/Twist@gz.msgs.Twist
      /odom@nav_msgs/msg/Odometry@gz.msgs.Odometry
      /model/turtle/joint/joint_left/cmd_vel@std_msgs/msg/Float64@gz.msgs.Double
      /model/turtle/joint/joint_right/cmd_vel@std_msgs/msg/Float64@gz.msgs.Double
      && wait
      "
    network_mode: host
    ipc: host

  rosbridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.ros
    container_name: rosbridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROSBRIDGE_PORT=${ROSBRIDGE_PORT:-8192}
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=${ROSBRIDGE_PORT:-8192}"
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    container_name: orchestrator
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ORCHESTRATOR_PORT=${ORCHESTRATOR_PORT:-8191}
      - MAP=${MAP:-simple}
      - ROBOT_START_X=${ROBOT_START_X:-0}
      - ROBOT_START_Y=${ROBOT_START_Y:-0}
    volumes:
      - ./config_nodes_edges:/configs
    command: bash -c "source /opt/ros/jazzy/setup.bash && uvicorn main:app --host 0.0.0.0 --port ${ORCHESTRATOR_PORT:-8191}"
    network_mode: host
    ipc: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: web
    ports:
      - "${WEB_PORT:-8190}:80"
    networks: [fleet]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fleet:
    driver: bridge